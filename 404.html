<!DOCTYPE html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Stranica nije pronađena | Meni je pomoglo</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px max(24px,env(safe-area-inset-right)) 24px max(24px,env(safe-area-inset-left));background:#F3F5F8;color:#0B1B33;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#56657A}
h1{margin:16px 0 0;font-size:clamp(36px,8vw,56px);line-height:1.04;letter-spacing:-.035em;font-weight:600}
p{margin:18px 0 0;font-size:17px;line-height:1.6;color:#56657A}
a{display:inline-block;margin-top:28px;background:#1F4BFF;color:#fff;text-decoration:none;border-radius:12px;padding:16px 22px;font-size:16px;font-weight:600}
a:hover{filter:brightness(1.1)}
</style>
</head>
<body>
<main>
  <div class="code">Greška 404</div>
  <h1>Ova stranica ne postoji.</h1>
  <p>Link je možda zastareo ili je adresa pogrešno ukucana. Vrati se na početnu i izaberi svoj paket.</p>
  <a id="home" href="/">Nazad na početnu</a>
</main>
<script>
/* GitHub Pages projekat živi na /ime-repozitorijuma/ — link vodi na koren tog projekta */
(function(){var seg=location.pathname.split('/')[1];if(/\.github\.io$/.test(location.hostname)&&seg){document.getElementById('home').href='/'+seg+'/';}})();
</script>
</body>
</html>
